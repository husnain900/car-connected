<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Aurora Teal Gradient -->
    <linearGradient id="favTealGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2E8B8B" />
      <stop offset="50%" stopColor="#3FA3A3" />
      <stop offset="100%" stopColor="#236F70" />
    </linearGradient>

    <!-- Muted Slate Gradient -->
    <linearGradient id="favInkGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1F2A37" />
      <stop offset="50%" stopColor="#374151" />
      <stop offset="100%" stopColor="#5B6675" />
    </linearGradient>

    <!-- Pearl Surface Core -->
    <linearGradient id="favPearlCore" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#EEF2F5" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Background Container -->
  <path
    d="M32 3L58 15V39L32 61L6 39V15L32 3Z"
    fill="url(#favPearlCore)"
    stroke="url(#favTealGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Inner Aero Delta-Wing Chevron -->
  <path
    d="M32 9L52 19L32 27L12 19L32 9Z"
    fill="#E7F3F1"
    stroke="url(#favTealGrad)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Dynamic "N" Hypercar Left Wing -->
  <path
    d="M20 46V23L32 37V51L20 46Z"
    fill="url(#favTealGrad)"
    stroke="#236F70"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Dynamic "N" Hypercar Right Wing -->
  <path
    d="M44 21V43L32 29V17L44 21Z"
    fill="url(#favInkGrad)"
    stroke="#1F2A37"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Central Telemetry Horizon Star -->
  <circle cx="32" cy="33" r="3.5" fill="#2E8B8B" />
  <circle cx="32" cy="33" r="6" stroke="#2E8B8B" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Alignment Telemetry Crosshairs -->
  <line x1="32" y1="3" x2="32" y2="7" stroke="#2E8B8B" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="57" x2="32" y2="61" stroke="#2E8B8B" stroke-width="2" stroke-linecap="round" />
</svg>
