<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Celestial Ice Blue Gradient -->
    <linearGradient id="favCyanGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#79C7FF" />
      <stop offset="50%" stopColor="#9BD7FF" />
      <stop offset="100%" stopColor="#4FA8F5" />
    </linearGradient>

    <!-- Titanium Chrome Bevel -->
    <linearGradient id="favTitanium" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F5F8FC" />
      <stop offset="50%" stopColor="#A5B5C8" />
      <stop offset="100%" stopColor="#293C51" />
    </linearGradient>

    <!-- Dark Shield Core -->
    <linearGradient id="favAeroCore" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E314B" />
      <stop offset="100%" stopColor="#091321" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="favGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Background Container -->
  <path
    d="M32 3L58 15V39L32 61L6 39V15L32 3Z"
    fill="url(#favAeroCore)"
    stroke="url(#favTitanium)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Inner Aero Delta-Wing Chevron -->
  <path
    d="M32 9L52 19L32 27L12 19L32 9Z"
    fill="url(#favCyanGrad)"
    fill-opacity="0.3"
    stroke="url(#favCyanGrad)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Dynamic "N" Hypercar Left Wing -->
  <path
    d="M19 44V22L32 36V49L19 44Z"
    fill="url(#favCyanGrad)"
    stroke="#79C7FF"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Dynamic "N" Hypercar Right Wing -->
  <path
    d="M45 20V42L32 28V15L45 20Z"
    fill="url(#favTitanium)"
    stroke="#F5F8FC"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Central Celestial Quantum Pulse Core -->
  <circle cx="32" cy="32" r="3.5" fill="#79C7FF" filter="url(#favGlow)" />
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />
</svg>
